<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Gallery Frame Cards -->
  <rect x="38" y="62" width="52" height="132" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2" />
  <rect x="166" y="62" width="52" height="132" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2" />

  <!-- Active Slot #2 Video Card -->
  <rect x="66" y="48" width="124" height="160" rx="16" fill="#0B1120" stroke="url(#accentGrad)" stroke-width="4" />

  <!-- Play Triangle -->
  <polygon points="112,100 156,128 112,156" fill="url(#accentGrad)" />

  <!-- CDN Stream Arcs -->
  <path d="M92 180 Q128 194 164 180" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Privacy Shield Dot -->
  <circle cx="176" cy="64" r="14" fill="#10B981" stroke="#0B1120" stroke-width="3" />
  <polyline points="170,64 174,69 183,59" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
